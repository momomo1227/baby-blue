<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little Memories ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4faff;color:#52677b;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;text-align:center}.wrap{max-width:680px;margin:auto;padding:24px 18px}.hero{background:white;border:1px solid #d9ebfa;border-radius:28px;padding:34px 18px;box-shadow:0 8px 28px #d9eaf566}.heart{color:#e6a6bf;font-size:28px}.eyebrow{letter-spacing:3px;color:#7aaed7;font-size:12px}.days{font-size:76px;font-weight:bold;color:#76b4e8;margin:12px 0}.days small{font-size:20px}.date{color:#8ca0b2;font-size:13px}.section{margin-top:24px;background:white;border-radius:22px;padding:24px 18px;border:1px solid #e1eef8}.note{background:#f0f8ff;padding:15px;border-radius:16px;line-height:1.8}.footer{padding:24px;font-size:12px;color:#9aafc0}
</style>
</head>
<body><main class="wrap"><section class="hero"><div class="heart">♡ ♡ ♡</div><p class="eyebrow">OUR LITTLE STORY</p><h1>ふたりの思い出ノート</h1><p>出会ってから</p><div class="days" id="days">177<small>日目</small></div><p class="date">2026.05.05 — forever together</p><p>これからも、ふたりの思い出を増やそう。</p></section><section class="section"><h2>🩵 ふたりのこと</h2><p class="note">ここは、ふたりの大切な思い出のお部屋。<br>たくさん笑って、たくさん思い出を作ろうね。</p></section><section class="section"><h2>📸 ふたりのアルバム</h2><p>これから写真アルバムをつなげるよ。</p><p class="note">写真をふたりで共有する機能は、次の設定で追加するね。<br>今は個人的な写真をここに載せないでね。</p></section><p class="footer">Made with ♡ for two</p></main><script>const start=new Date(2026,4,5);const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());document.getElementById("days").innerHTML=Math.floor((today-start)/86400000)+1+"<small>日目</small>";</script></body></html>
